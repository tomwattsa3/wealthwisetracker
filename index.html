
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>WealthWise Tracker</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WealthWise" />
    <meta name="theme-color" content="#f8fafc" />
    <!-- Dark mode before anything draws, so the loading screen matches -->
    <script>try { if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <!-- Fonts load in the background: the app draws straight away in a similar font, then swaps -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <style>
      body {
        font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      /* Hide amounts (lib/privacy.ts): each amount gets a soft blur in its own colour via per-colour
         ::highlight rules the script adds. This element blur is only the fallback for chart labels
         and browsers without highlights. */
      [data-amt] { transition: filter 0.25s ease; }
      html.privacy [data-amt] { filter: blur(calc((2.64px + 0.088em) * var(--amt-k, 1))); user-select: none; }
      /* Touch screens: feel like an app — no grey tap flash, no double-tap zoom or tap delay, and
         long-pressing a button doesn't select its text or pop up the copy menu (text in lists
         stays selectable). */
      /* A bottom sheet is open: freeze the page behind it (see components/Sheet.tsx). */
      html.sheet-open, html.sheet-open body, html.sheet-open main { overflow: hidden !important; }
      @media (pointer: coarse) {
        html { -webkit-tap-highlight-color: transparent; }
        * { touch-action: manipulation; }
        button, a, [role="button"], [role="tab"], nav, label { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      }
      /* Stop the whole app rubber-banding on iOS when a gesture hits the edge of the page */
      html, body {
        overscroll-behavior: none;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Modern Stripe-like Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        border: 2px solid #f8fafc;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #525252;
        border: 2px solid #262626;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #737373;
      }
    </style>
</head>
  <body class="bg-slate-50 dark:bg-neutral-900 text-slate-900 dark:text-neutral-200 antialiased selection:bg-violet-100 selection:text-violet-700">
    <!-- Shown the moment the app opens (replaced as soon as it has loaded), so Android's logo
         screen only flashes by -->
    <div id="root"><div class="min-h-screen bg-slate-100 dark:bg-neutral-900 p-3 md:pl-[280px] md:p-8" aria-hidden="true">
      <div class="max-w-md md:max-w-none mx-auto flex flex-col gap-3 animate-pulse">
        <div class="flex items-center justify-between px-1 pt-1"><div class="h-7 w-24 rounded-lg bg-slate-200 dark:bg-neutral-800"></div><div class="h-8 w-28 rounded-xl bg-slate-200 dark:bg-neutral-800"></div></div>
        <div class="flex gap-1.5"><div class="h-[30px] w-24 rounded-full bg-slate-200 dark:bg-neutral-800"></div><div class="h-[30px] w-32 rounded-full bg-slate-200/70 dark:bg-neutral-800/70"></div><div class="h-[30px] w-16 rounded-full bg-slate-200/70 dark:bg-neutral-800/70"></div></div>
        <div class="rounded-2xl bg-white dark:bg-neutral-800 border border-slate-200 dark:border-neutral-700 p-4"><div class="h-3 w-28 rounded bg-slate-100 dark:bg-neutral-700"></div><div class="h-9 w-36 rounded-lg bg-slate-200 dark:bg-neutral-700 mt-2"></div><div class="h-24 rounded-xl bg-slate-100 dark:bg-neutral-700/60 mt-4"></div></div>
        <div class="rounded-2xl bg-white dark:bg-neutral-800 border border-slate-200 dark:border-neutral-700 p-4 flex flex-col gap-3"><div class="h-4 w-32 rounded bg-slate-200 dark:bg-neutral-700"></div><div class="h-9 rounded-lg bg-slate-100 dark:bg-neutral-700/60"></div><div class="h-9 rounded-lg bg-slate-100 dark:bg-neutral-700/60"></div><div class="h-9 rounded-lg bg-slate-100 dark:bg-neutral-700/60"></div></div>
      </div>
    </div></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
